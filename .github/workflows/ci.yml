name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Lint / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Provide stubs so Next.js build succeeds without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          MOCK_MODE: "true"

      - name: Test (schema contracts + unit tests)
        run: npm test

  smoke:
    name: Smoke (preview)
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel preview deployment
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            resp=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&meta-githubCommitSha=$GITHUB_SHA&limit=1")
            state=$(echo "$resp" | jq -r '.deployments[0].state // "MISSING"')
            url=$(echo  "$resp" | jq -r '.deployments[0].url   // ""')
            echo "attempt=$i state=$state url=$url"
            case "$state" in
              READY)          echo "url=https://$url" >> "$GITHUB_OUTPUT"; exit 0 ;;
              ERROR|CANCELED) echo "Vercel deploy $state"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out after 10 minutes waiting for Vercel preview"; exit 1

      - name: Smoke — schemas
        run: |
          curl --fail -sS "${{ steps.preview.outputs.url }}/api/health/schemas" | tee /dev/stderr | jq -e '.ok == true'

      - name: Smoke — pipeline (mock mode)
        run: |
          curl --fail -sS "${{ steps.preview.outputs.url }}/api/health/pipeline?mock=1" | tee /dev/stderr | jq -e '.ok == true'
